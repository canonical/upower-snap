snapcraft-version: 8.8.1
snapcraft-started-at: '2025-05-07T06:43:40.302124Z'
snapcraft-os-release-id: ubuntu
snapcraft-os-release-version-id: '22.04'
name: upower
version: 0.99.17-1
summary: An abstraction for power devices
description: |
  UPower is an abstraction for enumerating power devices, listening
  to device events and querying history and statistics.
base: core22
grade: stable
confinement: strict
apps:
  upowerd:
    command: usr/libexec/upowerd
    daemon: dbus
    slots:
    - upower
    plugs:
    - hardware-observe
    - bluez
    daemon-scope: system
    activates-on:
    - upower-dbus
  upower:
    command: usr/bin/upower
    plugs:
    - upower-client
parts:
  upower-copyright:
    plugin: nil
    stage-packages:
    - libgudev-1.0-0=1:237-2build1
    - libimobiledevice6=1.3.0-6build3
    - libplist3=2.2.0-6build2
    - libupower-glib3=0.99.17-1
    - libusbmuxd6=2.0.2-3build2
    - upower=0.99.17-1
    stage:
    - usr/share/doc/libupower-glib3/copyright
    - usr/share/doc/libupower-glib3/changelog.*
    - usr/share/doc/upower/copyright
    - usr/share/doc/upower/changelog.*
    prime: []
    build-packages: []
  upower:
    build-packages:
    - meson
    - libglib2.0-dev
    - xsltproc
    - libgudev-1.0-dev
    - gtk-doc-tools
    stage-packages:
    - libgudev-1.0-0=1:237-2build1
    plugin: meson
    meson-parameters:
    - --prefix=/usr
    source-type: git
    source-branch: applied/ubuntu/jammy
    source: https://git.launchpad.net/ubuntu/+source/upower
    stage: []
    prime: []
architectures:
- amd64
image-info:
  build_url: https://launchpad.net/~snappy-hwe-team/snappy-hwe-snaps/+snap/upower-snap-22/+build/2797253
build-packages: []
build-snaps: []
primed-stage-packages:
- libgudev-1.0-0=1:237-2build1
- libupower-glib3=0.99.17-1
- upower=0.99.17-1
