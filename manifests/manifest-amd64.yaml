snapcraft-os-release-id: ubuntu
snapcraft-os-release-version-id: '24.04'
name: upower
version: 1.90.2-1
summary: An abstraction for power devices
description: |
  UPower is an abstraction for enumerating power devices, listening
  to device events and querying history and statistics.
base: core24
grade: stable
confinement: strict
apps:
  upowerd:
    command: usr/libexec/upowerd
    daemon: dbus
    slots:
    - upower
    plugs:
    - hardware-observe
    - bluez
    daemon-scope: system
    activates-on:
    - upower-dbus
  upower:
    command: usr/bin/upower
    plugs:
    - upower-client
parts:
  upower-copyright:
    plugin: nil
    stage-packages:
    - libgudev-1.0-0=1:238-5ubuntu1
    - libimobiledevice6=1.3.0-8.1build3
    - libplist-2.0-4=2.3.0-1~exp2build2
    - libupower-glib3=1.90.3-1
    - libusbmuxd6=2.0.2-4build3
    - upower=1.90.3-1
    stage:
    - usr/share/doc/libupower-glib3/copyright
    - usr/share/doc/libupower-glib3/changelog.*
    - usr/share/doc/upower/copyright
    - usr/share/doc/upower/changelog.*
    prime: []
    build-packages: []
  upower:
    build-packages:
    - meson
    - libglib2.0-dev
    - xsltproc
    - libgudev-1.0-dev
    - gtk-doc-tools
    stage-packages:
    - libgudev-1.0-0=1:238-5ubuntu1
    plugin: meson
    meson-parameters:
    - --prefix=/usr
    source-type: git
    source-branch: applied/ubuntu/noble-updates
    source: https://git.launchpad.net/ubuntu/+source/upower
    stage: []
    prime: []
architectures:
- amd64
image-info:
  build_url: https://launchpad.net/~snappy-hwe-team/snappy-hwe-snaps/+snap/upower-snap-24/+build/2797230
build-packages: []
build-snaps: []
primed-stage-packages:
- libgudev-1.0-0=1:238-5ubuntu1
- libupower-glib3=1.90.3-1
- upower=1.90.3-1
